[project]
name = "radiradi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "davey>=0.1.0,<0.2",
    "discord-py[voice]>=2.7.1",
    "python-dotenv>=1.2.4",
    "yt-dlp[default]>=2026.10.26",
]

[project.scripts]
radiradi = "radiradi:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
